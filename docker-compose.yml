services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chainbreaker
      POSTGRES_USER: chainbreaker
      POSTGRES_PASSWORD: ${CHAINBREAKER_POSTGRES_PASSWORD:-chainbreaker-secure-pass}
    volumes:
      - chainbreaker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainbreaker -d chainbreaker"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      CHAINBREAKER_ENVIRONMENT: development
      CHAINBREAKER_API_TOKEN: ${CHAINBREAKER_API_TOKEN:-cb-demo-token-9981}
      CHAINBREAKER_DATABASE_URL: postgresql+psycopg://chainbreaker:${CHAINBREAKER_POSTGRES_PASSWORD:-chainbreaker-secure-pass}@db:5432/chainbreaker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chainbreaker-runtime:/app/runtime

volumes:
  chainbreaker-postgres:
  chainbreaker-runtime:
